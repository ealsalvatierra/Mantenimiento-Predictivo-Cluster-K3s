apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto-broker
  namespace: predictivo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1-node
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:latest
        ports:
        - containerPort: 1883
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  namespace: predictivo
spec:
  type: ClusterIP
  ports:
  - port: 1883
    targetPort: 1883
  selector:
    app: mosquitto
